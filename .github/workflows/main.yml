name: UniDone CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. Вказуємо шлях до папки, де безпосередньо лежить package.json
    defaults:
      run:
        working-directory: ./kanban_board/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # 2. Шлях до лок-файлу ВІД КОРЕНЯ репозиторію
          cache-dependency-path: "kanban_board/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Project
        run: npm run build
