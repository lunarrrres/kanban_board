name: CI/CD Pipeline

# 1. Тригери запуску: контролюємо якість коду перед злиттям і при деплої
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # === ЕТАП 1: ПЕРЕВІРКА ТА ТЕСТУВАННЯ БЕКЕНДУ ===
  backend-testing:
    name: Backend CI (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Оскільки package.json у бекенді лежить окремо, кешуємо його
          cache-dependency-path: "./backend/package.json"

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run ESLint (Backend)
        run: |
          cd backend
          # Запуститься, якщо в backend/package.json прописаний скрипт lint
          npm run lint --if-present

  # === ЕТАП 2: ТЕСТУВАННЯ ТА ЗБІРКА ФРОНТЕНДУ ===
  frontend-testing-and-build:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run ESLint & Prettier
        run: |
          cd frontend
          npm run lint

      - name: Run Unit Tests (Vitest)
        run: |
          cd frontend
          # Запуск тестів у CI-режимі (без watch-режиму)
          npm run test:run --if-present

      # === ЕТАП 3: E2E ТЕСТУВАННЯ (PLAYWRIGHT) ===
      # Playwright потребує встановлення системних браузерів у контейнер
      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: Start Backend Server
        run: |
          cd backend
          nohup npm start >/tmp/kanban-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat /tmp/kanban-backend.log
          exit 1

      - name: Run E2E Tests (Playwright)
        run: |
          cd frontend
          npm run test:e2e --if-present

      # === ЕТАП 4: ПРОД-ЗБІРКА (BUILD) ===
      # Перевіряємо, що Vite успішно компілює проєкт у папку dist без помилок
      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      # Опціонально: зберігаємо артефакт збірки, якщо планується деплой
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: frontend/dist/
