name: UniDone CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # МИ ВИДАЛИЛИ cache: 'npm' і cache-dependency-path
          # Тепер GitHub не буде шукати лок-файл на цьому етапі

      - name: Install dependencies
        # Запускаємо звичайний install прямо в потрібній папці
        run: |
          cd kanban_board/frontend
          npm install

      - name: Run Linter
        run: |
          cd kanban_board/frontend
          npm run lint

      - name: Run Unit Tests
        run: |
          cd kanban_board/frontend
          npm run test:unit

      - name: Build Project
        run: |
          cd kanban_board/frontend
          npm run build
